name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  container:
    name: Container health and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build local image
        run: docker build --tag rqm-ising:ci .

      - name: Verify unprivileged runtime and health endpoint
        run: |
          user_id="$(docker run --rm rqm-ising:ci id -u)"
          test "$user_id" != "0"
          container_id="$(docker run --detach --publish 127.0.0.1:18000:8000 rqm-ising:ci)"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent http://127.0.0.1:18000/health >/dev/null
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "$container_id")" = "exited" ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Block fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rqm-ising:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

