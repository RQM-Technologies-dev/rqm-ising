name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-image-${{ inputs.tag_name || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/rqm-technologies-dev/rqm-ising
  TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  validate:
    name: Validate release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Match package and tag versions
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$package_version" = "$TAG_NAME"

      - name: Build local image
        run: docker build --tag rqm-ising:release-candidate .

      - name: Verify unprivileged runtime and health endpoint
        run: |
          user_id="$(docker run --rm rqm-ising:release-candidate id -u)"
          test "$user_id" != "0"
          container_id="$(docker run --detach --publish 127.0.0.1:18000:8000 rqm-ising:release-candidate)"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent http://127.0.0.1:18000/version >/dev/null
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "$container_id")" = "exited" ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Block fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rqm-ising:release-candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  publish:
    name: Publish multi-architecture image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}
            type=sha
            type=raw,value=latest,enable=${{ !contains(env.TAG_NAME, '-') }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Generate GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attach image identity to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          jq -n \
            --arg image "$IMAGE_NAME" \
            --arg tag "$TAG_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            '{schema_version:"rqm.container-release.v0.1", image:$image, tag:$tag, digest:$digest, commit:$commit, platforms:["linux/amd64","linux/arm64"], sbom:true, provenance:"mode=max", github_attestation:true}' \
            > release-manifest.json
          gh release upload "$TAG_NAME" release-manifest.json --clobber

